name: Deploy EC2 Instance

on:
  workflow_dispatch: # Allows manual trigger from the Actions tab

jobs:
  deploy-ec2:
    runs-on: ubuntu-latest

    steps:
      # Checkout the repository (for reference)
      - name: Checkout Code
        uses: actions/checkout@v2

      # SSH into EC2 and set up the environment
      - name: Deploy EC2 Instance
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          script: |
            # Update and install dependencies
            sudo apt-get update && sudo apt-get install -y git curl build-essential

            # Install Node.js
            curl -fsSL https://deb.nodesource.com/setup_lts.x | sudo -E bash -
            sudo apt-get install -y nodejs

            # Install PM2 for process management
            sudo npm install -g pm2

            # Clone the repository
            git clone https://github.com/<your-repo>.git /home/ubuntu/cloud_project

            # Backend setup
            cd /home/ubuntu/cloud_project/recipes-BE
            npm install
            pm2 start npm --name "backend" -- start

            # Frontend setup
            cd /home/ubuntu/cloud_project/recipes-FE
            npm install
            npm run build
            pm2 serve build 3000 --name "frontend"
