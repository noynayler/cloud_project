name: CI

on: [push]
    
jobs:
  js_checks:
    name: JavaScript Code Quality and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set Up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      # Ensures the JavaScript code follows best practices
      - name: Run ESLint
        run: npx eslint . --ext .js --output-file eslint-report.txt
        continue-on-error: true  

      - name: Upload ESLint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.txt
          
      - name: Run Tests
        working-directory: ./recipes-BE
        run: npx jest --verbose --ci

  image_scan:
        name: Build Image and Run Image Scan
        runs-on: ubuntu-latest
      
        steps:
            - name: Checkout Code
              uses: actions/checkout@v2
            - name: Ensure daemon.json Exists
              run: |
                  if [ ! -f /etc/docker/daemon.json ]; then
                    echo '{}' | sudo tee /etc/docker/daemon.json > /dev/null
                  fi
            - name: Set Up Docker
              uses: docker-practice/actions-setup-docker@v1

            

                
            - name: Build Docker
              run: docker build -f Dockerfile -t myapp:latest .
              
            - name: Install Docker Scout and Run Scan
              run: |
                curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh -o install-scout.sh
                sh install-scout.sh
                echo ${{secrets.DOCKER_PWD}} | docker login -u ${{secrets.DOCKER_USER}} --password-stdin
                docker scout quickview --output scout-report.sarif
                docker scout cves --output scout-report.sarif

            - name: Upload Scout Report
              uses: actions/upload-artifact@v4
              if: always()
              with: 
                  name: docker-scout-finding
                  path: scout-report.sarif
                  
            -  name: Tag Docker Image
               run: docker tag myapp:latest ${{ secrets.DOCKER_USER }}/myapp:latest
              
            - name: Login to Docker Hub
              run: echo ${{ secrets.DOCKER_PWD }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin
            
            - name: Push Docker Image to Docker Hub
              if: success()
              run: docker push ${{ secrets.DOCKER_USER }}/myapp:latest

            - name: Prepare SSH Key
              run: |
                  echo "${{ secrets.EC2_SSH_KEY }}" | base64 -d > ec2-key.pem
                  chmod 400 ec2-key.pem
        
            - name: Deploy to EC2
              run: |
                  ssh -o StrictHostKeyChecking=no -i ec2-key.pem ${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }} << 'EOF'
                  docker login -u ${{ secrets.DOCKER_USER }} -p ${{ secrets.DOCKER_PASSWORD }}
                  docker pull ${{ secrets.DOCKER_USER }}/myapp:latest
                  docker stop myapp || true && docker rm myapp || true
                  docker run -d --name myapp -p 80:5000 ${{ secrets.DOCKER_USER }}/myapp:latest
                  EOF




