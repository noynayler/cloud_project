name: Update EC2 with Latest Changes

on:
  push:
    branches:
      - main 

jobs:
  update-ec2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
        
      - name: Set Up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.8

      - name: Install Bandit
        run: pip install bandit
      
      - name: Run Bandit Scan
        run: bandit -r . -f json -o bandit-report.json

      # SSH into EC2 and update the code
      - name: Update EC2 Instance
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_PRIVATE_KEY }}
          port: 22
          script: |
            cd /opt/cloud_project

            git pull origin main

            # Backend updates
            cd recipes-BE
            npm install
            pm2 restart backend

            # Frontend updates
            cd ../recipes-FE
            npm install
            npm run build
            pm2 restart frontend
