name: Secure CI/CD Pipeline


on: [push]

jobs:
  js_checks:
    name: JavaScript Code Quality and Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Set Up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Install Dependencies
        run: npm install

      # Ensures the JavaScript code follows best practices
      - name: Run ESLint
        run: npx eslint . -c .js --output-file eslint-report.txt
        continue-on-error: true

      - name: Upload ESLint Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.txt

      - name: Run npm audit (Security Scan)
        run: npm audit --production --audit-level=critical

      - name: Set Environment Variables
        run: |
            echo "DB_NAME=${{ secrets.DB_NAME }}" >> $GITHUB_ENV
            echo "DB_USER=${{ secrets.DB_USER }}" >> $GITHUB_ENV
            echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}" >> $GITHUB_ENV
            echo "DB_HOST=${{ secrets.DB_HOST }}" >> $GITHUB_ENV
            echo "DB_PORT=3306" >> $GITHUB_ENV

#      - name: Run Tests
#        working-directory: ./recipes-BE
#        run: npx jest --verbose --ci

  image_scan:
    name: Build Image, Version Control, and Run Image Scan
    runs-on: ubuntu-latest
#    needs: js_checks

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Ensure daemon.json Exists
        run: |
              if [ ! -f /etc/docker/daemon.json ]; then
                echo '{}' | sudo tee /etc/docker/daemon.json > /dev/null
              fi

      - name: Extract Version Information
        run: |
            VERSION=$(date +'%Y%m%d')-$(git rev-parse --short HEAD)
            echo "DOCKER_IMAGE_VERSION=$VERSION" >> $GITHUB_ENV

      - name: Set Up Docker
        uses: docker-practice/actions-setup-docker@v1

      - name: Login to Docker Hub
        run: echo ${{ secrets.DOCKER_PWD }} | docker login -u ${{ secrets.DOCKER_USER }} --password-stdin

      - name: Build Backend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/recipes-backend:${{ env.DOCKER_IMAGE_VERSION }} -t ${{ secrets.DOCKER_USER }}/recipes-backend:latest -f recipes-BE/Dockerfile recipes-BE/

      - name: Push Backend Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USER }}/recipes-backend:${{ env.DOCKER_IMAGE_VERSION }}
          docker push ${{ secrets.DOCKER_USER }}/recipes-backend:latest

      # ---- FRONTEND ----
      - name: Build Frontend Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USER }}/recipes-frontend:${{ env.DOCKER_IMAGE_VERSION }} -t ${{ secrets.DOCKER_USER }}/recipes-frontend:latest -f recipes-fe/Dockerfile recipes-fe/

      - name: Push Frontend Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USER }}/recipes-frontend:${{ env.DOCKER_IMAGE_VERSION }}
          docker push ${{ secrets.DOCKER_USER }}/recipes-frontend:latest

      # ---- image scan ----

      - name: Install Docker Scout and Run Scan
        run: |
          curl -fsSL https://raw.githubusercontent.com/docker/scout-cli/main/install.sh -o install-scout.sh
          sh install-scout.sh
          docker scout quickview ${{ secrets.DOCKER_USER }}/myapp:latest --output quickview-report.sarif
          docker scout cves ${{ secrets.DOCKER_USER }}/myapp:latest --output cves-report.sarif

      - name: Upload Scout Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
            name: docker-scout-finding
            path: |
                  quickview-report.sarif
                  cves-report.sarif




  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
#    needs: image_scan

    steps:
      - name: Checkout Code
        uses: actions/checkout@v2

      - name: Prepare SSH Key
        run: |
          echo "${{ secrets.EC2_SSH_KEY }}" > ec2-key.pem
          chmod 600 ec2-key.pem

      - name: Deploy to EC2
        run: |
          ssh -o StrictHostKeyChecking=no -i ec2-key.pem ec2-user@${{ secrets.EC2_HOST }} << 'EOF'
          echo "${{ secrets.DOCKER_PWD }}" | docker login -u "${{ secrets.DOCKER_USER }}" --password-stdin
          docker pull ${{ secrets.DOCKER_USER }}/recipes-backend:latest
          docker pull ${{ secrets.DOCKER_USER }}/recipes-frontend:latest
          
          # Ensure the container exists before stopping/removing it
          docker ps -q --filter "name=recipes-backend" | grep -q . && docker stop recipes-backend || echo "No container to stop"
          docker ps -aq --filter "name=recipes-backend" | grep -q . && docker rm recipes-backend || echo "No container to remove"
          docker run -d --name recipes-backend -p 80:3000 -p 3001:3001 ${{ secrets.DOCKER_USER }}/recipes-backend:latest
          docker ps -q --filter "name=recipes-frontend" | grep -q . && docker stop recipes-frontend || echo "No container to stop"
          docker ps -aq --filter "name=recipes-frontend" | grep -q . && docker rm rrecipes-frontend || echo "No container to remove"
          docker run -d --name recipes-frontend -p 3000:3000  ${{ secrets.DOCKER_USER }}/recipes-frontend:latest          
          
          EOF
          






